name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Used by both the Vitest browser tests and the Playwright e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:browser
      - run: npm run build:lib
      - run: npm run build:demo
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report
            .vitest
          retention-days: 7
          include-hidden-files: true

  # Installs the packed library into a fresh Angular app, as a consumer would. See scripts/consumer-check.mjs
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run consumer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: consumer-report
          path: playwright-report
          retention-days: 7
